# Pi Autopilot - Multi-platform configuration example
#
# Supports multiple providers: local (Ollama, MLX) and external (OpenAI, Anthropic)
#
# ======================= CONFIGURATION =======================
#
# For use on any server, the provider is configurable.
# You can connect to:
#   - Local server: Ollama, MLX (macOS Apple Silicon)
#   - External server: OpenAI API, Anthropic API, compatible endpoint
#   - Any server with OpenAI/Anthropic-compatible endpoint
#
# ======================= REPOSITORY =======================

# Repository to manage
repo: OWNER/REPO

# GitHub milestone label (optional)
milestone: ""

# Issue label filter (optional).
# Empty string = every open issue (no filter). Set e.g. `agent-ready` to narrow the queue.
label: ""

# Directory for state and artifacts (relative to config)
state_dir: ./autopilot-state

# Managed (isolated) Pi agent directory holding the generated models.json.
# All supervisor Pi sessions run with PI_CODING_AGENT_DIR pointing here, so
# your global ~/.pi/agent is never read or modified. Relative values resolve
# under state_dir; default: <state_dir>/pi/agent. Sessions live in
# <state_dir>/pi/sessions. Regenerate any time with:
#   ./pi-autopilot setup -config config.yaml
# pi_agent_dir: ./pi/agent

# Polling interval (seconds) for checking new issues
poll_seconds: 60

# Timeout before Telegram notification for inactive issues
idle_timeout_minutes: 20

# Timeout per stage before Telegram notification
stage_timeout_minutes: 180

# Maximum retries per stage before blocking
max_stage_retries: 3

# Maximum review rounds before blocking
max_review_rounds: 3

# Maximum fix attempts in CI before blocking
max_ci_fixes: 2

# Maximum local fix attempts before blocking
max_local_fixes: 3

# Maximum base-sync rounds (deterministic rebase of the PR branch onto the
# moved base after publication) before blocking for manual resolution
max_base_sync_rounds: 3

# Wait time for CI completion (minutes)
ci_wait_minutes: 30

# Merge policy: false = manual (leave PR open), true = auto (squash merge)
# Once started, this policy is immutable for the issue
auto_merge: false

# Local check commands suggested to the verify model as starting points.
# These are still the operator-authoritative source (check_commands). The
# verify model no longer re-decides a resolvable repository: when the repo's
# entrypoints are discoverable (Go, Node, Makefile, GitHub Actions run: steps)
# the list is chosen deterministically with no LLM, in the order
# check_commands -> resolved -> plan -> model, with every command filtered to
# the canonical entrypoint allowlist. The model is consulted only when nothing
# is discoverable; it drops a command the repository cannot run and records the
# exclusion in local-checks.md. If empty and nothing is resolvable, local
# verification blocks.
check_commands:
  - make check

# Optional architecture constraint, parallel to check_commands (issue #9, AC-3).
# check_arch[i] maps 1:1 onto check_commands[i] and accepts any (default),
# amd64 or arm64. A check whose arch the host cannot run natively (e.g. an arm64
# constraint on a linux/amd64 host) is never executed locally: it is recorded
# BLOCKED with a bounded cause (non-zero, never a silent skip) and only the
# remote_checks runner on that arch can satisfy it for the exact commit.
# The list must not exceed check_commands; each value is enum-validated at
# config load (any/amd64/arm64), so a typo blocks config load.
# check_arch: [any, arm64]

# Optional remote-check runner (issue #9, AC-6). Dispatches a same-repo GitHub
# Actions workflow on the exact head commit to satisfy checks the host recorded
# BLOCKED (arch-mismatch). It is an operator-named, same-repo, SHA-pinned
# workflow with no elevated permissions; its result is accepted ONLY when the
# run's headSha equals local HEAD and the conclusion is success — any other
# outcome (dispatch failure, timeout, non-success, sha-mismatch) is a distinct
# block reason that keeps local_verify failed and routes like a failure.
# Empty workflow = feature off (today's exact behavior). ref is an optional
# full 40-hex commit SHA (default: local HEAD at dispatch); timeout_seconds
# bounds the wait (default 1800). The workflow name is validated to be a bare
# filename (no path separator / metacharacter) since it is interpolated into a
# gh run create argument.
# remote_checks:
#   workflow: "arm64-checks.yml"
#   # ref: "0123456789abcdef0123456789abcdef01234567"   # optional; default HEAD
#   timeout_seconds: 1800

# Log substrings indicating known CI infrastructure failures
# Only matching failures get one deterministic `gh run rerun --failed`
ci_rerun_patterns:
  - "The job was not started because"

# Optional GitHub Projects status update (leave blank to disable)
project_number: 0
project_owner: ""
project_in_progress: "In Progress"

# ======================= MODEL CONFIGURATION =======================
#
# AVAILABLE PROVIDERS:
#   - omlx        : Local Apple Silicon (macOS)
#   - ollama      : Local Ollama server
#   - openai      : OpenAI API (external)
#   - anthropic   : Anthropic API (external)
#   - openai-compatible : Any OpenAI-compatible endpoint
#   - anthropic-compatible : Any Anthropic-compatible endpoint
#
# CONFIGURATION FOR USING EXTERNAL SERVER:
#
# Option A: External dedicated server
#   provider: openai
#   base_url: https://api.openai.com/v1 (or your custom endpoint)
#   api_key: "sk-..." (or use OPENAI_API_KEY environment variable)
#
# Option B: Ollama server on another host
#   provider: ollama
#   base_url: http://ollama-server.example.com:11434
#
# Option C: Remote MLX server (macOS)
#   provider: omlx
#   (requires MLX installation on remote server)
#
# ======================= EXAMPLES =======================
#
# 1. OpenAI API (external):
#    provider: openai
#    base_url: https://api.openai.com/v1
#    api_key: ""  # or configure OPENAI_API_KEY
#    id: gpt-4o-mini
#
# 2. Anthropic API (external):
#    provider: anthropic
#    base_url: https://api.anthropic.com/v1
#    api_key: ""  # or configure ANTHROPIC_API_KEY
#    id: claude-3-5-sonnet-20240620
#
# 3. Local Ollama:
#    provider: ollama
#    base_url: http://localhost:11434
#    id: qwen2.5:7b
#
# 4. Remote Ollama:
#    provider: ollama
#    base_url: http://ollama.example.com:11434
#    id: qwen2.5:7b
#
# 5. Custom OpenAI-compatible endpoint:
#    provider: openai-compatible
#    base_url: http://llm-custom.example.com/v1
#    api_key: ""  # or API_KEY_DEL_SERVIDOR
#    id: your-model-name
#
# 6. Remote oMLX server (OpenAI-compatible endpoint, e.g. mlx_server):
#    provider: omlx
#    base_url: https://mac-studio.example:8000/v1
#    api_key: "${OMLX_API_KEY}"   # env reference, never inlined
#    id: Qwen3.8-27B-4bit
#
#    Raspberry Pi (Linux ARM64) → Mac Studio topology: serve the MLX model on
#    the Mac with an OpenAI-compatible server (mlx_server --model ... --port
#    8000), point base_url at it, and run `pi-autopilot doctor` as the
#    pre-flight. doctor probes GET /models on the endpoint and exits non-zero
#    with an actionable message when the endpoint is unreachable or rejects
#    the credential — a down Mac blocks the stage with that error, never a
#    silent fallback to a local Ollama. Plain http off-LAN gets a visible
#    transport warning; prefer Tailscale or an https reverse proxy.
#
# ======================= API KEY SAFETY =======================
# In the generated models.json, api_key values are environment references
# ($NAME / ${NAME}) that Pi interpolates at request time. A literal key in
# this file is delivered to Pi only through the child process environment
# (PI_AUTOPILOT_KEY_*) and is never written to disk or process arguments.
# Preferred: api_key: "${OPENAI_API_KEY}" (any env variable name).
#
# ======================= CONFIGURATION =======================
models:
  investigate:
    # Provider configurable (empty for auto-detect)
    provider: ""  # empty = auto-detect (omlx on macOS, ollama elsewhere)
    id: qwen2.5:7b   # Change based on your provider/model
    thinking: low
    # For external provider:
    # provider: openai
    # base_url: https://api.openai.com/v1
    # api_key: ""  # or configure OPENAI_API_KEY
    # id: gpt-4o-mini

  plan:
    provider: ""
    id: qwen2.5:7b
    thinking: medium

  implement:
    provider: ""
    id: qwen2.5:7b
    thinking: "off"

  review:
    provider: ""
    id: qwen2.5:1.5b
    thinking: low

  chat:
    provider: ""
    id: qwen2.5:7b
    thinking: low

  # triage is optional: it reorders the open issues into the execution queue.
  # An absent or empty entry inherits the plan model, so existing configs keep working.
  triage:
    provider: ""
    id: qwen2.5:7b
    thinking: low

  # verify is optional: it inspects the repository's build/CI definitions and
  # returns the list of local commands the deterministic verifier executes.
  # It is consulted ONLY when the repository's entrypoints are not resolvable
  # deterministically (no Go/Node/Makefile/Actions entrypoint); a resolvable
  # repository never spends a model call to discover its checks (issue #8).
  # An absent or empty entry inherits the plan model; if the model run fails,
  # the plan's own checks block is used instead.
  verify:
    provider: ""
    id: qwen2.5:7b
    thinking: low

# ======================= WEB SEARCH (OPTIONAL, DEFAULT OFF) =======================
#
# Pinned web-search extension for read-only stage sessions. Absent or
# enabled: false = today's behavior exactly (no -e anywhere, --no-extensions
# in every session).
#
# When enabled:
#   - `extension` must be an immutable pin: npm:<package>@<x.y.z> (exact
#     version, never @latest/ranges) or git:<repo>@<40-char commit>.
#   - `sha256` is the supervisor-verified hash of the installed extension
#     content; a mismatch fails closed and purges the managed install.
#   - `allowed_roles` may only name read-only roles (investigate, plan,
#     verify, triage, chat); implement and review are rejected at config load.
#   - Allowed roles get ONE explicit -e path under the managed agent dir plus
#     the extension's `web_search` tool in the --tools allowlist; every other
#     role keeps today's exact argv. Sessions label search results as
#     untrusted data via --append-system-prompt.
#   - The backend URL/key/timeout reach the extension as PI_AUTOPILOT_WEBSEARCH_*
#     child environment entries. api_key: "${SEARXNG_API_KEY}" (env reference,
#     preferred) or a literal (injected only as PI_AUTOPILOT_WEBSEARCH_KEY_<BACKEND>).
#   - Initial install needs the npm registry (or git) once; the extension is
#     installed under the managed agent dir (state_dir) — global ~/.pi is
#     untouched. Verify with: ./pi-autopilot doctor
#
# web_search:
#   enabled: false
#   extension: "npm:@trusted/pi-websearch@1.2.3"
#   sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
#   allowed_roles: [investigate, plan]
#   backend: searxng
#   backend_url: http://searxng:8080
#   api_key: "${SEARXNG_API_KEY}"
#   timeout_seconds: 120

# ======================= ALLOWED MODELS LIST (Telegram) =======================
#
# List of models that can be changed via Telegram (/use <role> <model>)
# Includes local and external models
allowed_models:
  # Ollama models
  - qwen2.5:7b
  - qwen2.5:1.5b
  - qwen2.5:14b

  # OpenAI models
  - gpt-4o-mini
  - gpt-4o
  - gpt-3.5-turbo

  # Anthropic models
  - claude-3-5-sonnet-20240620
  - claude-3-5-sonnet-20241022

  # MLX models (macOS Apple Silicon)
  - Qwen3.5-9B-MLX-8bit
  - Qwen3.8-27B-4bit
  - Qwen3-Coder-Next-MLX-4bit
  - GLM-4.7-Flash-MLX-8bit
  - MiMo-V2.6-Distill-Qwen-9B-MLX-4bit

# ======================= TELEGRAM CONFIGURATION =======================

# Your authorized chat ID (must be positive)
# Get this by running: ./pi-autopilot discover-chat
telegram_chat_id: 0

# ======================= OPTIONAL ENVIRONMENT VARIABLES =======================
#
# For external providers, use environment variables for API keys:
#
#   OPENAI_API_KEY=sk-... ./pi-autopilot run -config config.yaml
#   ANTHROPIC_API_KEY=sk-... ./pi-autopilot run -config config.yaml
#
# Or configure directly in YAML under api_key
