name: SemVer Release

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/semver/**'
      - 'cmd/bump-version/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install GitHub CLI
        run: echo "gh_version=$(gh --version)" && gh --version

      - name: Authenticate with GitHub
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Build bump-version tool
        run: |
          go build -o bin/bump-version ./cmd/bump-version/

      - name: Calculate version
        id: bump
        run: |
          bin/bump-version > /dev/null
          VERSION=$(grep "New version:" <<< "$(bin/bump-version)" | head -1 | awk '{print $4}')
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "Version calculated: $VERSION"

      - name: Create and push Git tag
        if: env.VERSION != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"

      - name: Generate release notes
        if: env.VERSION != ''
        run: |
          cat > .github/releases/v${{ env.VERSION }}.md << NOTES
# Release v${{ env.VERSION }}

## 🎉 New Features
* Add new features here

## 🐛 Bug Fixes
* Fix bugs here

## 📝 Other Changes
* Other changes here

*This is an automated release generated by the SemVer tool.*
NOTES
          echo "Release notes generated"

      - name: Create GitHub Release
        if: env.VERSION != ''
        run: |
          gh release create "v${{ env.VERSION }}" \
            --title "Release v${{ env.VERSION }}" \
            --notes-path .github/releases/v${{ env.VERSION }}.md \
            --draft
